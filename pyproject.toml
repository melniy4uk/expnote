[project]
name = "expnote"
version = "0.1.0"
description = "Python library for creating research reports during experiments"
readme = "README.md"
authors = [
    { name = "Melnik", email = "melniy4uk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[tool.ruff.lint]
extend-select = ["I"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
